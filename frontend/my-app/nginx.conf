server {
    listen 80;
    server_name 13.49.23.159.nip.io;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 13.49.23.159.nip.io;

    ssl_certificate     /etc/letsencrypt/live/13.49.23.159.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.49.23.159.nip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React SPA routing - redirect all 404s to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
