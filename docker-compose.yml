version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: karthiksdumb/codeconnect-backend:latest
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    volumes:
      - dind-certs-client:/certs/client
    depends_on:
      dind:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: codeconnect-nginx
    ports:
      - "5005:5005"
    depends_on:
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:5005
    image: karthiksdumb/codeconnect-frontend:latest
    container_name: codeconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  dind:
    image: docker:dind
    container_name: codeconnect-dind
    hostname: dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    expose:
      - "2376"
    volumes:
      - dind-storage:/var/lib/docker
      - dind-certs-client:/certs/client
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /certs/client/ca.pem"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

volumes:
  dind-storage:
  dind-certs-client: